[package]
name = "furnicraft-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = { workspace = true }
furnicraft-geom = { workspace = true }
furnicraft-scene = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
# Parses and validates `scene.wgsl` in tests; already in the tree through `wgpu`.
naga = { version = "30", features = ["wgsl-in"] }
# Tests build a polyline, which carries a document id; already in the tree through `scene`.
furnicraft-model = { workspace = true }
# The ignored pixel test renders the product envelope offscreen and writes it next to the UI shots.
furnicraft-testkit = { workspace = true }
pollster = { workspace = true }
